<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Jongo Demo</title>
  <style>
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      max-width: 720px;
      margin: 60px auto;
      padding: 0 40px;
      line-height: 2;
      color: #222;
      background: #fafafa;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #555;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 32px;
    }
    .label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 32px;
      margin-bottom: 4px;
    }
    p {
      font-size: 22px;
      margin: 0 0 8px;
    }
  </style>
</head>
<body>
  <h1>Jongo Demo</h1>

  <div class="label">1</div>
  <p>静かな公園で本を読んだ。</p>

  <div class="label">2</div>
  <p>りんごを食べさせられたくなかった。</p>

  <div class="label">3</div>
  <p>友達がくれた本を読んだ。</p>

  <div class="label">4</div>
  <p>雨が降っているから、家にいる。</p>

  <div class="label">5</div>
  <p>友達がくれた本を静かな公園で読んだから、家に帰った。</p>

  <div class="label">6</div>
  <p>「昨日買った本が面白かった」と友達に言ったから、彼も同じ本を買った。</p>
</body>
</html>
