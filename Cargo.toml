[package]
name = "jongo"
version = "1.0.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
lindera = { version = "3.0.7", features = ["embed-ipadic"] }
phf = { version = "0.13.1", features = ["macros"] }
wasm-bindgen = "0.2.123"
web-sys = { version = "0.3.100", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Node", "MouseEvent", "KeyboardEvent", "Event", "EventTarget", "console", "Range", "CaretPosition", "DomRect", "Selection", "NodeList", "CssStyleDeclaration", "DomTokenList"] }
strum = "0.26"
strum_macros = "0.26"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = "1.1.3"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.77"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
flate2 = "1.1.9"
lindera-dictionary = "3.0.7"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11.0"
tar = "0.4.46"
ureq = "3.3.0"
